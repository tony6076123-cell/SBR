<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBR 技術長訓練系統</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',sans-serif;background:#0C3A6B;min-height:100vh;overscroll-behavior:none;}

/* ── 頁面切換 ── */
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* ══════════════════ 登入頁 ══════════════════ */
#page-login{
  background:linear-gradient(160deg,#0C3A6B 0%,#185FA5 60%,#1a7abf 100%);
  align-items:center;justify-content:center;padding:24px;
}
.login-logo{text-align:center;margin-bottom:40px;}
.login-logo .badge{
  width:80px;height:80px;border-radius:24px;
  background:rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;margin:0 auto 16px;
  border:2px solid rgba(255,255,255,0.25);
}
.login-logo h1{color:#fff;font-size:22px;font-weight:900;letter-spacing:2px;}
.login-logo p{color:rgba(255,255,255,0.7);font-size:13px;margin-top:6px;}
.login-card{
  background:#fff;border-radius:24px;padding:28px 24px;
  width:100%;max-width:360px;
}
.login-card h2{font-size:16px;font-weight:700;color:#0C3A6B;margin-bottom:20px;text-align:center;}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.name-btn{
  padding:14px 8px;border-radius:14px;border:2px solid #e8edf5;
  background:#f8faff;font-size:14px;font-weight:600;color:#185FA5;
  cursor:pointer;transition:all .15s;text-align:center;
}
.name-btn:active,.name-btn.selected{background:#185FA5;color:#fff;border-color:#185FA5;}
.login-sep{text-align:center;color:#aaa;font-size:12px;margin:12px 0;}
.tech-btn{
  width:100%;padding:14px;border-radius:14px;
  background:#0C3A6B;color:#fff;font-size:15px;font-weight:700;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
.tech-btn:active{opacity:.85;}

/* ══════════════════ 主畫面 ══════════════════ */
#page-home{background:#f0f4f8;}
.app-header{
  background:linear-gradient(135deg,#0C3A6B,#185FA5);
  padding:20px 20px 28px;
  border-radius:0 0 28px 28px;
}
.app-header .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.app-header .app-title{color:#fff;font-size:17px;font-weight:900;letter-spacing:1px;}
.logout-btn{
  background:rgba(255,255,255,0.15);color:#fff;
  border:none;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;
}
.user-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.15);border-radius:20px;
  padding:8px 14px;
}
.user-chip .avatar{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
}
.user-chip .info .name{color:#fff;font-size:14px;font-weight:700;}
.user-chip .info .role{color:rgba(255,255,255,.7);font-size:11px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-left:4px;}

.menu-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:20px 16px;
}
.menu-card{
  background:#fff;border-radius:20px;padding:20px 14px 16px;
  text-align:center;border:none;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  transition:transform .12s,box-shadow .12s;
  position:relative;overflow:hidden;
}
.menu-card:active{transform:scale(0.95);box-shadow:0 1px 6px rgba(0,0,0,0.08);}
.menu-card .card-icon{
  width:56px;height:56px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 12px;
}
.menu-card .card-label{font-size:15px;font-weight:700;color:#1a2340;}
.menu-card .card-desc{font-size:11px;color:#8a95a8;margin-top:4px;}
.menu-card.wide{grid-column:1/-1;}
.icon-blue{background:#E6F1FB;}
.icon-green{background:#EAF3DE;}
.icon-amber{background:#FAEEDA;}
.icon-teal{background:#E1F5EE;}
.icon-purple{background:#EEEDFE;}
.icon-red{background:#FCEBEB;}

/* ══════════════════ 功能頁共用 header ══════════════════ */
.sub-header{
  background:linear-gradient(135deg,#0C3A6B,#185FA5);
  padding:16px 20px;display:flex;align-items:center;gap:12px;
  border-radius:0 0 20px 20px;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.15);border:none;
  color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sub-header h2{color:#fff;font-size:17px;font-weight:700;}
.page-body{flex:1;padding:16px;overflow-y:auto;}

/* ══════════════════ 簽到頁 ══════════════════ */
#page-sign{}
.sign-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.sign-card h3{font-size:14px;font-weight:700;color:#185FA5;margin-bottom:14px;}
canvas#sig-pad{
  width:100%;height:160px;border-radius:12px;
  border:2px dashed #d0d9e8;background:#f8faff;touch-action:none;
  display:block;
}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn-primary{
  flex:1;padding:13px;border-radius:12px;
  background:#185FA5;color:#fff;font-size:14px;font-weight:700;
  border:none;cursor:pointer;
}
.btn-primary:active{opacity:.85;}
.btn-secondary{
  flex:1;padding:13px;border-radius:12px;
  background:#f0f4f8;color:#185FA5;font-size:14px;font-weight:600;
  border:none;cursor:pointer;
}
.sign-list{display:flex;flex-direction:column;gap:8px;}
.sign-item{
  display:flex;align-items:center;gap:12px;
  background:#f8faff;border-radius:12px;padding:12px 14px;
}
.sign-item .s-name{font-size:14px;font-weight:600;color:#1a2340;flex:1;}
.sign-item .s-time{font-size:11px;color:#8a95a8;}
.sign-badge{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:#EAF3DE;color:#3B6D11;
}

/* ══════════════════ 教材頁 ══════════════════ */
.material-card{
  background:#fff;border-radius:20px;padding:20px;
  margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.material-card h3{font-size:14px;font-weight:700;color:#185FA5;margin-bottom:12px;}
textarea.material-input{
  width:100%;min-height:140px;border:1.5px solid #d0d9e8;
  border-radius:12px;padding:12px;font-size:14px;
  font-family:'Noto Sans TC',sans-serif;resize:vertical;
  background:#f8faff;color:#1a2340;
}
textarea.material-input:focus{outline:none;border-color:#185FA5;}
.material-display{
  background:#f8faff;border-radius:12px;padding:14px;
  font-size:14px;color:#1a2340;line-height:1.8;white-space:pre-wrap;
  min-height:80px;
}
.img-preview{max-width:100%;border-radius:12px;margin-top:10px;}

/* ══════════════════ 考試頁 ══════════════════ */
.quiz-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.q-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.q-num{font-size:13px;color:#8a95a8;}
.q-bar{flex:1;height:6px;background:#e8edf5;border-radius:3px;}
.q-bar-fill{height:100%;background:#185FA5;border-radius:3px;transition:width .3s;}
.q-text{font-size:16px;font-weight:700;color:#1a2340;margin-bottom:16px;line-height:1.6;}
.q-options{display:flex;flex-direction:column;gap:10px;}
.q-opt{
  padding:14px 16px;border-radius:14px;border:2px solid #e8edf5;
  background:#f8faff;font-size:14px;color:#1a2340;cursor:pointer;
  transition:all .12s;text-align:left;
}
.q-opt:active{transform:scale(0.98);}
.q-opt.selected{border-color:#185FA5;background:#E6F1FB;color:#0C3A6B;}
.q-opt.correct{border-color:#3B6D11;background:#EAF3DE;color:#3B6D11;}
.q-opt.wrong{border-color:#A32D2D;background:#FCEBEB;color:#A32D2D;}
.answer-hint{
  margin-top:12px;padding:12px;border-radius:12px;
  background:#FAEEDA;font-size:13px;color:#633806;display:none;
}
.score-card{
  background:linear-gradient(135deg,#0C3A6B,#185FA5);
  border-radius:20px;padding:32px 20px;text-align:center;
  margin-bottom:14px;
}
.score-num{font-size:64px;font-weight:900;color:#fff;}
.score-label{font-size:14px;color:rgba(255,255,255,.7);margin-top:4px;}

/* ══════════════════ 語音備課 ══════════════════ */
.voice-status{
  text-align:center;padding:32px 20px;
  background:#fff;border-radius:20px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.mic-btn{
  width:80px;height:80px;border-radius:50%;
  background:#185FA5;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;margin:0 auto 16px;
  box-shadow:0 4px 20px rgba(24,95,165,0.35);
  transition:all .12s;
}
.mic-btn.recording{background:#E24B4A;animation:pulse 1s infinite;}
.mic-btn:active{transform:scale(0.92);}
@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(226,75,74,0.35);}50%{box-shadow:0 4px 30px rgba(226,75,74,0.6);}}
.transcript-box{
  background:#fff;border-radius:20px;padding:20px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.transcript-text{
  min-height:120px;font-size:14px;color:#1a2340;
  line-height:1.8;white-space:pre-wrap;
}

/* ══════════════════ 成績統計 ══════════════════ */
.stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{
  background:#fff;border-radius:16px;padding:16px;
  text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.stat-box .stat-num{font-size:28px;font-weight:900;color:#185FA5;}
.stat-box .stat-label{font-size:11px;color:#8a95a8;margin-top:4px;}
.result-list{display:flex;flex-direction:column;gap:8px;}
.result-item{
  background:#fff;border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 8px rgba(0,0,0,0.05);
}
.result-item .r-name{font-size:14px;font-weight:700;color:#1a2340;flex:1;}
.result-item .r-score{font-size:18px;font-weight:900;color:#185FA5;}
.result-item .r-grade{
  font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;
}
.grade-pass{background:#EAF3DE;color:#3B6D11;}
.grade-fail{background:#FCEBEB;color:#A32D2D;}

/* ══════════════════ 密碼對話框 ══════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;
  z-index:1000;padding:24px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fff;border-radius:24px;padding:28px 24px;
  width:100%;max-width:320px;
}
.modal-box h3{font-size:16px;font-weight:700;color:#0C3A6B;margin-bottom:16px;text-align:center;}
.modal-input{
  width:100%;padding:13px;border-radius:12px;border:1.5px solid #d0d9e8;
  font-size:16px;text-align:center;margin-bottom:14px;
  font-family:'Noto Sans TC',sans-serif;
}
.modal-input:focus{outline:none;border-color:#185FA5;}
.modal-btns{display:flex;gap:10px;}

/* ══════════════════ Toast ══════════════════ */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#1a2340;color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:2000;
  white-space:nowrap;
}
#toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ════════════ 登入頁 ════════════ -->
<div id="page-login" class="page active">
  <div class="login-logo">
    <div class="badge">🔧</div>
    <h1>SBR 訓練系統</h1>
    <p>永康廠 · 歸仁廠</p>
  </div>
  <div class="login-card">
    <h2>請選擇您的姓名</h2>
    <div class="name-grid" id="name-grid"></div>
    <div class="login-sep">── 或 ──</div>
    <button class="tech-btn" onclick="openTechLogin()">🔑 技術長 / 管理員登入</button>
  </div>
</div>

<!-- ════════════ 主選單 ════════════ -->
<div id="page-home" class="page">
  <div class="app-header">
    <div class="top-row">
      <div class="app-title">SBR 訓練系統</div>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
    <div class="user-chip">
      <div class="avatar" id="home-avatar">?</div>
      <div class="info">
        <div class="name" id="home-name">未登入</div>
        <div class="role" id="home-role">學員</div>
      </div>
      <div class="status-dot"></div>
    </div>
  </div>
  <div class="menu-grid" id="menu-grid"></div>
</div>

<!-- ════════════ 手寫簽到 ════════════ -->
<div id="page-sign" class="page">
  <div class="sub-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>✍️ 手寫簽到</h2>
  </div>
  <div class="page-body">
    <div class="sign-card">
      <h3>請在下方簽名</h3>
      <canvas id="sig-pad"></canvas>
      <div class="btn-row">
        <button class="btn-secondary" onclick="clearSig()">清除</button>
        <button class="btn-primary" onclick="submitSig()">確認簽到</button>
      </div>
    </div>
    <div class="sign-card" id="sign-list-wrap" style="display:none;">
      <h3>今日簽到紀錄 <span id="sign-count" style="font-weight:400;color:#8a95a8;font-size:12px;"></span></h3>
      <div class="sign-list" id="sign-list"></div>
    </div>
  </div>
</div>

<!-- ════════════ 學習教材 ════════════ -->
<div id="page-material" class="page">
  <div class="sub-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>📖 學習教材</h2>
  </div>
  <div class="page-body">
    <!-- 技術長輸入區 -->
    <div class="material-card" id="material-tech-input" style="display:none;">
      <h3>建立課程教材</h3>
      <input type="text" id="material-title" placeholder="課程標題（例：SBR工法第一講）"
        style="width:100%;padding:12px;border-radius:12px;border:1.5px solid #d0d9e8;font-size:15px;font-weight:700;margin-bottom:10px;font-family:'Noto Sans TC',sans-serif;">
      <textarea class="material-input" id="material-text" placeholder="輸入課程內容..."></textarea>
      <input type="file" id="material-img" accept="image/*" style="display:none;" onchange="previewImg(this)">
      <img id="material-img-preview" class="img-preview" style="display:none;">
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn-secondary" onclick="document.getElementById('material-img').click()">📷 圖片</button>
        <button class="btn-primary" onclick="saveMaterial()">💾 儲存 + 產生QR碼</button>
      </div>
    </div>
    <!-- QR 碼顯示區（儲存後出現）-->
    <div class="material-card" id="material-qr-wrap" style="display:none;text-align:center;">
      <h3 id="material-qr-title" style="margin-bottom:12px;"></h3>
      <div id="material-qr-code" style="display:inline-block;background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;"></div>
      <div style="font-size:12px;color:#8a95a8;margin-bottom:12px;">學員掃描此 QR 碼直接進入考試</div>
      <button class="btn-secondary" onclick="showCourseList()" style="font-size:13px;">📋 查看所有課程</button>
    </div>
    <!-- 課程列表（技術長用）-->
    <div class="material-card" id="material-course-list" style="display:none;">
      <h3 style="margin-bottom:12px;">📚 所有課程</h3>
      <div id="course-list-body"></div>
    </div>
    <!-- 學員閱讀區 -->
    <div class="material-card" id="material-display-wrap">
      <h3 id="material-display-title" style="color:#185FA5;margin-bottom:12px;"></h3>
      <div class="material-display" id="material-display">載入中...</div>
      <img id="material-display-img" class="img-preview" style="display:none;">
    </div>
  </div>
</div>

<!-- ════════════ 線上考試 ════════════ -->
<div id="page-exam" class="page">
  <div class="sub-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>📝 線上考試</h2>
  </div>
  <div class="page-body" id="exam-body">
    <div class="quiz-card" style="text-align:center;padding:32px 20px;">
      <div style="font-size:48px;margin-bottom:16px;">🤖</div>
      <div style="font-size:16px;font-weight:700;color:#1a2340;margin-bottom:8px;">AI 智能出題</div>
      <div style="font-size:13px;color:#8a95a8;margin-bottom:24px;">根據教材內容自動生成 10 道題目</div>
      <button class="btn-primary" onclick="startExam()" style="max-width:200px;margin:0 auto;display:block;">開始考試</button>
    </div>
  </div>
</div>

<!-- ════════════ 語音備課 ════════════ -->
<div id="page-voice" class="page">
  <div class="sub-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>🎤 語音備課</h2>
  </div>
  <div class="page-body">
    <!-- 錄音區 -->
    <div class="voice-status">
      <button class="mic-btn" id="mic-btn" onclick="toggleRecording()">🎤</button>
      <div id="mic-status" style="font-size:14px;font-weight:600;color:#1a2340;">點擊開始錄音</div>
      <div style="font-size:12px;color:#8a95a8;margin-top:4px;">支援手機與電腦</div>
    </div>
    <!-- 逐字稿 -->
    <div class="transcript-box" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="font-size:14px;font-weight:700;color:#185FA5;">逐字稿</span>
        <button class="btn-secondary" onclick="saveTranscript()" style="padding:6px 14px;font-size:12px;border-radius:8px;">儲存為教材</button>
      </div>
      <div class="transcript-text" id="transcript-text">錄音後自動顯示逐字稿...</div>
    </div>
    <!-- 教學圖片 6 張 -->
    <div style="background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);">
      <div style="font-size:14px;font-weight:700;color:#185FA5;margin-bottom:12px;">📸 教學圖片（6張）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="voice-img-grid">
        <!-- 由 JS 生成 -->
      </div>
    </div>
  </div>
</div>

<!-- ════════════ 成績統計 ════════════ -->
<div id="page-stats" class="page">
  <div class="sub-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>📊 成績統計</h2>
  </div>
  <div class="page-body">
    <div class="stats-summary">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">-</div>
        <div class="stat-label">考試人數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-avg">-</div>
        <div class="stat-label">平均分數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-pass">-</div>
        <div class="stat-label">及格人數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-sign">-</div>

function initSign(){
  sigCanvas = document.getElementById('sig-pad');
  sigCtx = sigCanvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  sigCanvas.width = sigCanvas.offsetWidth * ratio;
  sigCanvas.height = sigCanvas.offsetHeight * ratio;
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#185FA5';
  sigCtx.lineWidth = 3;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  clearSig();
  // touch
  sigCanvas.addEventListener('touchstart', e=>{e.preventDefault(); const t=e.touches[0]; const r=sigCanvas.getBoundingClientRect(); isSigning=true; sigLastX=t.clientX-r.left; sigLastY=t.clientY-r.top;}, {passive:false});
  sigCanvas.addEventListener('touchmove', e=>{e.preventDefault(); if(!isSigning) return; const t=e.touches[0]; const r=sigCanvas.getBoundingClientRect(); const x=t.clientX-r.left, y=t.clientY-r.top; sigCtx.beginPath(); sigCtx.moveTo(sigLastX,sigLastY); sigCtx.lineTo(x,y); sigCtx.stroke(); sigLastX=x; sigLastY=y;}, {passive:false});
  sigCanvas.addEventListener('touchend', ()=>isSigning=false);
  // mouse
  sigCanvas.addEventListener('mousedown', e=>{const r=sigCanvas.getBoundingClientRect(); isSigning=true; sigLastX=e.clientX-r.left; sigLastY=e.clientY-r.top;});
  sigCanvas.addEventListener('mousemove', e=>{if(!isSigning) return; const r=sigCanvas.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top; sigCtx.beginPath(); sigCtx.moveTo(sigLastX,sigLastY); sigCtx.lineTo(x,y); sigCtx.stroke(); sigLastX=x; sigLastY=y;});
  sigCanvas.addEventListener('mouseup', ()=>isSigning=false);
  loadSignList();
}
function clearSig(){ if(!sigCtx) return; sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sigCtx.fillStyle='#f8faff'; sigCtx.fillRect(0,0,sigCanvas.width,sigCanvas.height); }
async function submitSig(){
  const imgData = sigCanvas.toDataURL('image/png');
  const now = new Date();
  const timeStr = now.toTimeString().slice(0,5);
  const dateStr = now.toISOString().slice(0,10);
  await db.collection('sbr_training').doc('sign_'+dateStr+'_'+currentUser.name).set({
    name: currentUser.name, date: dateStr, time: timeStr, sig: imgData, ts: Date.now()
  });
  showToast('✅ 簽到成功！');
  clearSig();
}

function resetExam(){

    <div class="quiz-card" style="text-align:center;padding:32px 20px;">

      <button class="btn-primary" onclick="startExam()" style="max-width:200px;margin:0 auto;display:block;">開始考試</button>
    </div>`;
}
async function startExam(){
  const body = document.getElementById('exam-body');
  body.innerHTML='<div class="quiz-card" style="text-align:center;padding:40px 20px;"><div style="font-size:32px;margin-bottom:12px;">⏳</div><div style="font-size:15px;color:#8a95a8;">AI 正在生成題目...</div></div>';
  // 讀取教材（依目前課程ID）
  const snap = await db.collection('sbr_training').doc(currentCourseId).get();
  const material = snap.exists ? (snap.data().text || '') : '';
  if(!material){ body.innerHTML='<div class="quiz-card" style="text-align:center;padding:32px;"><div style="font-size:15px;color:#A32D2D;">請先輸入教材內容</div></div>'; return; }
  // 呼叫 Claude API 出題
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:2000,
        messages:[{role:'user',content:`根據以下教材，出10道繁體中文四選一選擇題，每題有1個正確答案。
回傳純JSON陣列，不要其他文字，格式如下：
[{"q":"題目","opts":["A","B","C","D"],"ans":0,"exp":"解析"}]
ans是正確答案的index(0-3)。
教材：${material}`}]
      })
    });
    const data = await res.json();
    const text = data.content[0].text;
    const clean = text.replace(/```json|```/g,'').trim();
    questions = JSON.parse(clean);
    currentQ=0; answers=[];
    renderQuestion();
  } catch(e){ body.innerHTML='<div class="quiz-card" style="text-align:center;padding:32px;"><div style="font-size:15px;color:#A32D2D;">出題失敗，請重試</div></div>'; }
}
function renderQuestion(){
  const q = questions[currentQ];
  const body = document.getElementById('exam-body');
  const pct = (currentQ/questions.length*100).toFixed(0);
  body.innerHTML=`
    <div class="quiz-card">
      <div class="q-progress">
        <div class="q-bar"><div class="q-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-num">${currentQ+1}/${questions.length}</div>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="q-options" id="q-opts">
        ${q.opts.map((o,i)=>`<button class="q-opt" onclick="selectAns(${i})">${['A','B','C','D'][i]}. ${o}</button>`).join('')}
      </div>
      <div class="answer-hint" id="answer-hint"></div>
    </div>`;
}
function selectAns(idx){
  const q = questions[currentQ];
  answers.push(idx);
  const opts = document.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.disabled=true; if(i===q.ans) o.classList.add('correct'); else if(i===idx) o.classList.add('wrong'); });
  const hint = document.getElementById('answer-hint');
  hint.style.display='block';
  hint.textContent = idx===q.ans ? '✅ 正確！'+q.exp : '❌ 答錯了。'+q.exp;
  setTimeout(()=>{
    currentQ++;
    if(currentQ < questions.length) renderQuestion();
    else showScore();
  }, 1800);
}
async function showScore(){
  var correct = answers.filter(function(a,i){ return a===questions[i].ans; }).length;
  var score = Math.round(correct/questions.length*100);
  var pass = score>=60;
  if(db) await db.collection('sbr_training').add({
    type:'exam', name:currentUser.name, score:score, correct:correct, total:questions.length,
    pass:pass, date:new Date().toISOString().slice(0,10), ts:Date.now()
  });

  // 建立完整答案列表 HTML
  var answerHTML = '';
  questions.forEach(function(q, i){
    var myAns = answers[i];
    var isCorrect = myAns === q.ans;
    answerHTML += '<div style="background:'+(isCorrect?'#EAF3DE':'#FCEBEB')+';border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid '+(isCorrect?'#3B6D11':'#A32D2D')+'">';
    answerHTML += '<div style="font-size:13px;font-weight:700;color:#1a2340;margin-bottom:8px;">'+(i+1)+'. '+q.q+'</div>';
    q.opts.forEach(function(opt, oi){
      var isRight = oi === q.ans;
      var isMine = oi === myAns;
      var color = isRight ? '#3B6D11' : (isMine && !isRight ? '#A32D2D' : '#8a95a8');
      var mark = isRight ? ' ✅' : (isMine && !isRight ? ' ❌' : '');
      answerHTML += '<div style="font-size:12px;color:'+color+';padding:3px 0;font-weight:'+(isRight?'700':'400')+'">'+['A','B','C','D'][oi]+'. '+opt+mark+'</div>';
    });
    answerHTML += '<div style="font-size:11px;color:#185FA5;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.08);">💡 '+q.exp+'</div>';
    answerHTML += '</div>';
  });

  document.getElementById('exam-body').innerHTML =
    '<div class="score-card" style="margin-bottom:14px;">' +
      '<div class="score-num">'+score+'</div>' +
      '<div class="score-label">'+correct+'/'+questions.length+' 題正確 · '+(pass?'🎉 及格':'😢 未及格')+'</div>' +
    '</div>' +
    '<div class="quiz-card" style="margin-bottom:14px;">' +
      '<div style="font-size:15px;font-weight:700;color:#185FA5;margin-bottom:14px;">📋 完整答案解析</div>' +
      answerHTML +
      '<button class="btn-primary" onclick="startExam()" style="margin-top:8px;">🔄 重新測驗</button>' +
    '</div>';
}

// ════ 語音備課 ════
// ══════════════════════════════
function toggleRecording(){
  if(isRecording) stopRecording(); else startRecording();
}
function initVoiceImages(){
  var grid = document.getElementById('voice-img-grid');
  if(!grid) return;
  grid.innerHTML = '';
  for(var i=0; i<6; i++){
    (function(idx){
      var slot = document.createElement('div');
      slot.style.cssText = 'background:#f8faff;border-radius:14px;border:2px dashed #d0d9e8;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;';

      // 圖片顯示
      var imgEl = document.createElement('img');
      imgEl.style.cssText = 'width:100%;height:120px;object-fit:cover;display:none;border-radius:12px;';

      // 步驟標籤
      var label = document.createElement('div');
      label.style.cssText = 'font-size:13px;font-weight:700;color:#185FA5;margin-bottom:8px;';
      label.textContent = '步驟 '+(idx+1);

      // 兩個按鈕：拍照 + 上傳
      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:6px;';

      // 📷 拍照按鈕（手機直接開相機）
      var inpCamera = document.createElement('input');
      inpCamera.type='file'; inpCamera.accept='image/*'; inpCamera.capture='environment'; inpCamera.style.display='none';

      var btnCamera = document.createElement('button');
      btnCamera.textContent = '📷 拍照';
      btnCamera.style.cssText = 'padding:7px 12px;border-radius:10px;background:#185FA5;color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;';
      btnCamera.onclick = function(){ inpCamera.click(); };

      // 🖼 上傳按鈕（從相簿選）
      var inpFile = document.createElement('input');
      inpFile.type='file'; inpFile.accept='image/*'; inpFile.style.display='none';

      var btnFile = document.createElement('button');
      btnFile.textContent = '🖼 相簿';
      btnFile.style.cssText = 'padding:7px 12px;border-radius:10px;background:#f0f4f8;color:#185FA5;border:1px solid #d0d9e8;font-size:12px;font-weight:700;cursor:pointer;';
      btnFile.onclick = function(){ inpFile.click(); };

      // 刪除按鈕（有圖片時顯示）
      var btnDel = document.createElement('button');
      btnDel.textContent = '🗑️';
      btnDel.style.cssText = 'position:absolute;top:6px;right:6px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:12px;cursor:pointer;display:none;';
      btnDel.onclick = function(e){
        e.stopPropagation();
        imgEl.style.display='none'; imgEl.src='';
        label.style.display=''; btnRow.style.display='flex'; btnDel.style.display='none';
        if(db) db.collection('sbr_training').doc('voice_img_'+idx).delete();
      };

      function handleFile(file){
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          imgEl.src = e.target.result;
          imgEl.style.display='block';
          label.style.display='none';
          btnRow.style.display='none';
          btnDel.style.display='block';
          if(db) db.collection('sbr_training').doc('voice_img_'+idx).set({img:e.target.result, title:'步驟'+(idx+1), ts:Date.now()});
        };
        reader.readAsDataURL(file);
      }

      inpCamera.onchange = function(){ handleFile(inpCamera.files[0]); };
      inpFile.onchange = function(){ handleFile(inpFile.files[0]); };

      btnRow.appendChild(btnCamera);
      btnRow.appendChild(btnFile);
      slot.appendChild(imgEl);
      slot.appendChild(label);
      slot.appendChild(btnRow);
      slot.appendChild(btnDel);
      slot.appendChild(inpCamera);
      slot.appendChild(inpFile);

      // 讀取已存圖片
      if(db){
        db.collection('sbr_training').doc('voice_img_'+idx).get().then(function(snap){
          if(snap.exists && snap.data().img){
            imgEl.src=snap.data().img; imgEl.style.display='block';
            label.style.display='none'; btnRow.style.display='none'; btnDel.style.display='block';
          }
        });
      }
      grid.appendChild(slot);
    })(i);
  }
}
function startRecording(){
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ showToast('此瀏覽器不支援語音辨識'); return; }
  mediaRecognition = new SpeechRecognition();
  mediaRecognition.lang = 'zh-TW';
  mediaRecognition.continuous = true;
  mediaRecognition.interimResults = true;
  var el = document.getElementById('transcript-text');
  fullTranscript = (el.textContent === '錄音後自動顯示逐字稿...') ? '' : el.textContent;
  var saveTimer = null;
  mediaRecognition.onresult = function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) fullTranscript += e.results[i][0].transcript;
      else interim = e.results[i][0].transcript;
    }
    el.textContent = fullTranscript + interim;
    // 每3秒寫入 Firebase 一次（節省費用）
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if(db && fullTranscript) db.collection('sbr_training').doc('transcript_live').set({text: fullTranscript, ts: Date.now()});
    }, 3000);
  };
  mediaRecognition.onerror = function(e){ showToast('語音錯誤：'+e.error); stopRecording(); };
  mediaRecognition.start();
  isRecording = true;
  document.getElementById('mic-btn').classList.add('recording');
  document.getElementById('mic-btn').textContent = '⏹️';
  document.getElementById('mic-status').textContent = '錄音中...';
  // 開始監聽（電腦端自動更新）
  startTranscriptListener();
}
function stopRecording(){
  if(mediaRecognition){ mediaRecognition.stop(); mediaRecognition=null; }
  // 停止時存最終版本
  if(db && fullTranscript) db.collection('sbr_training').doc('transcript_live').set({text: fullTranscript, ts: Date.now()});
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎤';
  document.getElementById('mic-status').textContent = '點擊開始錄音';
}

// 電腦端即時監聽逐字稿
var transcriptListener = null;
function startTranscriptListener(){
  if(transcriptListener) return; // 已在監聽中
  transcriptListener = db.collection('sbr_training').doc('transcript_live').onSnapshot(function(snap){
    if(!snap.exists) return;
    var el = document.getElementById('transcript-text');
    if(el && !isRecording){ // 電腦端（非錄音方）才更新
      el.textContent = snap.data().text || '';
    }
  });
}

async function saveTranscript(){
  var text = document.getElementById('transcript-text').textContent;
  if(!text || text==='錄音後自動顯示逐字稿...'){ showToast('沒有內容可儲存'); return; }
  await db.collection('sbr_training').doc('material_current').set({text:text, img:'', savedBy:currentUser.name, ts:Date.now()});
  showToast('✅ 已儲存為教材');
}


// ══════════════════════════════
// ════ 成績統計 ════
// ══════════════════════════════
var statsListener = null;
function loadStats(){
  if(statsListener) statsListener();
  var dateStr = new Date().toISOString().slice(0,10);

  // 即時監聽簽到人數
  db.collection('sbr_training').where('date','==',dateStr).onSnapshot(function(snap){
    var signCount=0;
    snap.forEach(function(d){ if(!d.data().type) signCount++; });
    document.getElementById('stat-sign').textContent = signCount;
  });

  // 即時監聽考試成績
  statsListener = db.collection('sbr_training').where('type','==','exam').orderBy('ts','desc').onSnapshot(function(examSnap){
    var list = document.getElementById('result-list');
    if(examSnap.empty){
      list.innerHTML='<div style="text-align:center;color:#aaa;padding:20px;">尚無考試紀錄</div>';
      document.getElementById('stat-total').textContent=0;
      document.getElementById('stat-avg').textContent='-';
      document.getElementById('stat-pass').textContent=0;
      return;
    }
    var total=0, sumScore=0, passCount=0;
    list.innerHTML='';
    examSnap.forEach(function(d){
      var r=d.data();
      total++; sumScore+=r.score; if(r.pass) passCount++;
      var item=document.createElement('div');
      item.className='result-item';
      item.innerHTML='<div class="r-name">'+r.name+'</div><div class="r-score">'+r.score+'</div><span class="r-grade '+(r.pass?'grade-pass':'grade-fail')+'">'+(r.pass?'及格':'未及格')+'</span>';
      list.appendChild(item);
    });
    document.getElementById('stat-total').textContent=total;
    document.getElementById('stat-avg').textContent=Math.round(sumScore/total);
    document.getElementById('stat-pass').textContent=passCount;
  });
}
